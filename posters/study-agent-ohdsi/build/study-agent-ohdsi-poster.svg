<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="36in" version="1.1" viewBox="0 0 3456 2592" width="48in" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="2592" width="3456" x="0" y="0" /><rect fill="#17374A" height="385" rx="0" stroke="none" stroke-width="0" width="3456" x="0" y="0" /><g class="poster-text" id="title"><text fill="#FFFFFF" font-family="Open Sans" font-size="72" font-weight="bold" text-anchor="middle" x="1728.0" y="127.8552">OHDSI Study Agent for Human–AI Team-Based</text></g><g class="poster-text" id="subtitle"><text fill="#FFFFFF" font-family="Open Sans" font-size="50" font-weight="bold" text-anchor="middle" x="1728.0" y="217.07999999999998">Real-World Evidence Generation in the Veterans Health Administration</text></g><g class="poster-text" id="authors"><text fill="#DCE9ED" font-family="Open Sans" font-size="24" font-weight="normal" text-anchor="middle" x="1728.0" y="298.6184">Richard D. Boyce, PhD  |  University of Pittsburgh  |  VA Informatics and Computing Infrastructure (VINCI)</text></g><g class="poster-text" id="status"><text fill="#A9DCD2" font-family="Open Sans" font-size="18" font-weight="bold" text-anchor="middle" x="1728.0" y="344.5888">HYPOTHETICAL SYMPOSIUM POSTER • ARCHITECTURE / FUNCTIONAL-PROTOTYPE REPORT • SCIENTIFIC REVIEW REQUIRED</text></g><rect fill="#DFF2EC" height="245" rx="16" stroke="#B9D1CF" stroke-width="2" width="3312" x="72" y="424" /><g class="poster-text" id="takeaway-heading"><text fill="#16796F" font-family="Open Sans" font-size="22" font-weight="bold" text-anchor="start" x="120" y="482.77520000000004">CENTRAL TAKEAWAY</text></g><g class="poster-text" id="takeaway-copy"><text fill="#17374A" font-family="Open Sans" font-size="43" font-weight="bold" text-anchor="start" x="120" y="562.2944">Reusable, governed AI support for OHDSI workflows combines ACP/MCP coordination</text><text fill="#17374A" font-family="Open Sans" font-size="43" font-weight="bold" text-anchor="start" x="120" y="610.4544000000001">with deterministic validation — while researchers remain accountable for consequential decisions.</text></g><rect fill="#FBFCFB" height="1500" rx="16" stroke="#B9D1CF" stroke-width="2" width="810" x="72" y="718" /><g class="poster-text" id="gov-heading"><text fill="#17374A" font-family="Open Sans" font-size="30" font-weight="bold" text-anchor="start" x="112" y="788.648">WHY GOVERNED TEAMING?</text></g><line stroke="#16796F" stroke-width="3" x1="112" x2="842" y1="818" y2="818" /><g class="poster-text" id="gov-context"><text fill="#243846" font-family="Open Sans" font-size="25" font-weight="normal" text-anchor="start" x="112" y="900.04">RWE study design links judgments about</text><text fill="#243846" font-family="Open Sans" font-size="25" font-weight="normal" text-anchor="start" x="112" y="931.04">phenotypes, causal assumptions, cohorts,</text><text fill="#243846" font-family="Open Sans" font-size="25" font-weight="normal" text-anchor="start" x="112" y="962.04">and interpretation. AI assistance is bounded</text><text fill="#243846" font-family="Open Sans" font-size="25" font-weight="normal" text-anchor="start" x="112" y="993.04">where researchers need structured support.</text></g><g class="poster-text" id="gov-control-heading"><text fill="#16796F" font-family="Open Sans" font-size="22" font-weight="bold" text-anchor="start" x="112" y="1098.2751999999998">RESEARCHER OVERSIGHT</text></g><g class="poster-text" id="gov-control"><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1189.2151999999999">• Explicit confirmations and stage gates</text><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1216.4951999999998">• Validated outputs and auditable routing</text><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1243.7752">• Sanitized summaries / metadata to models</text><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1271.0552">• Fail-closed PHI/PII sanitation where applicable</text><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1298.3352">• Row-level clinical data are not sent to the model</text></g><g class="poster-text" id="gov-maturity-heading"><text fill="#16796F" font-family="Open Sans" font-size="22" font-weight="bold" text-anchor="start" x="112" y="1451.2751999999998">PROTOTYPE MATURITY</text></g><g class="poster-text" id="gov-maturity"><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1529.2151999999999">Early functional prototype: approx. TRL 4–5</text><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1556.4951999999998">(scripted laboratory demonstration).</text><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1583.7752" /><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1611.0552">Not established: efficiency, decision accuracy,</text><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1638.3352">calibrated reliance, or better study outcomes.</text></g><g class="poster-text" id="gov-scope-heading"><text fill="#16796F" font-family="Open Sans" font-size="22" font-weight="bold" text-anchor="start" x="112" y="1801.2751999999998">SCOPE OF CLAIM</text></g><g class="poster-text" id="gov-scope"><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1866.9951999999998">The generative model is coordinated by an</text><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1894.2751999999998">agent harness; Study Agent does not bundle</text><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="start" x="112" y="1921.5552">a model and does not replace researcher judgment.</text></g><rect fill="#FBFCFB" height="1012" rx="16" stroke="#B9D1CF" stroke-width="2" width="1590" x="918" y="718" /><g class="poster-text" id="architecture-heading"><text fill="#17374A" font-family="Open Sans" font-size="30" font-weight="bold" text-anchor="start" x="958" y="788.648">1  SERVICE-BASED, GOVERNED ARCHITECTURE</text></g><g class="poster-text" id="architecture-kicker"><text fill="#55727B" font-family="Open Sans" font-size="20" font-weight="normal" text-anchor="start" x="958" y="840.932">Distinct roles: clients access shared services; ACP, MCP and deterministic code are not interchangeable.</text></g><rect fill="#F4F1E9" height="143" rx="12" stroke="#B9D1CF" stroke-width="2" width="466" x="958" y="890" /><g class="poster-text" id="client-r-label"><text fill="#17374A" font-family="Open Sans" font-size="22" font-weight="bold" text-anchor="start" x="978" y="939.7752">R / Strategus shells</text></g><g class="poster-text" id="client-r-detail"><text fill="#55727B" font-family="Open Sans" font-size="18" font-weight="normal" text-anchor="start" x="978" y="985.0888">reported prototype integration</text></g><rect fill="#F4F1E9" height="143" rx="12" stroke="#B9D1CF" stroke-width="2" width="466" x="1474" y="890" /><g class="poster-text" id="client-atlas-label"><text fill="#17374A" font-family="Open Sans" font-size="22" font-weight="bold" text-anchor="start" x="1494" y="939.7752">Atlas3 / WebAPI</text></g><g class="poster-text" id="client-atlas-detail"><text fill="#55727B" font-family="Open Sans" font-size="18" font-weight="normal" text-anchor="start" x="1494" y="985.0888">early-stage integration</text></g><rect fill="#F4F1E9" height="143" rx="12" stroke="#B9D1CF" stroke-width="2" width="466" x="1990" y="890" /><g class="poster-text" id="client-coding-label"><text fill="#17374A" font-family="Open Sans" font-size="22" font-weight="bold" text-anchor="start" x="2010" y="939.7752">Coding agents + Skills.md</text></g><g class="poster-text" id="client-coding-detail"><text fill="#55727B" font-family="Open Sans" font-size="18" font-weight="normal" text-anchor="start" x="2010" y="985.0888">researcher context; unverified</text></g><rect fill="#D6EEE7" height="181" rx="14" stroke="#16796F" stroke-width="2" width="1096" x="1165" y="1144" /><g class="poster-text" id="acp-label"><text fill="#17374A" font-family="Open Sans" font-size="30" font-weight="bold" text-anchor="middle" x="1713.0" y="1204.6480000000001">ACP SERVER</text></g><g class="poster-text" id="acp-detail"><text fill="#243846" font-family="Open Sans" font-size="22" font-weight="normal" text-anchor="middle" x="1713.0" y="1247.7751999999998">Workflow orchestration • state • confirmations • routing • policy / safety checks</text></g><g class="arrow-connector" id="arrow-r-acp"><line stroke="#16796F" stroke-linecap="round" stroke-width="4" x1="1191" x2="1681.4353944373713" y1="1045" y2="1126.7392324062287" /><polygon fill="#16796F" points="1701.1632729140142,1130.0272121523358 1680.1202025389284,1134.6303837968858 1682.7505863358142,1118.8480810155716" /></g><g class="arrow-connector" id="arrow-atlas-acp"><line stroke="#16796F" stroke-linecap="round" stroke-width="4" x1="1707" x2="1710.798333068308" y1="1045" y2="1100.0758294904645" /><polygon fill="#16796F" points="1712.1743749006155,1120.0284360589242 1702.8172904409241,1100.6262462233874 1718.779375695692,1099.5254127575415" /></g><g class="arrow-connector" id="arrow-coding-acp"><line stroke="#16796F" stroke-linecap="round" stroke-width="4" x1="2223" x2="1744.54431610957" y1="1045" y2="1126.6189107813086" /><polygon fill="#16796F" points="1724.8291185410887,1129.9820915429907 1743.1990438048972,1118.7328317539161 1745.8895884142428,1134.504989808701" /></g><rect fill="#EAF1F7" height="160" rx="14" stroke="#B9D1CF" stroke-width="2" width="656" x="1000" y="1455" /><g class="poster-text" id="mcp-label"><text fill="#17374A" font-family="Open Sans" font-size="27" font-weight="bold" text-anchor="middle" x="1328.0" y="1511.3832">MCP SERVERS</text></g><g class="poster-text" id="mcp-detail"><text fill="#243846" font-family="Open Sans" font-size="20" font-weight="normal" text-anchor="middle" x="1328.0" y="1553.0320000000002">Bounded tools • prompt bundles</text><text fill="#243846" font-family="Open Sans" font-size="20" font-weight="normal" text-anchor="middle" x="1328.0" y="1577.832">Structured schemas</text></g><rect fill="#EAF1F7" height="160" rx="14" stroke="#B9D1CF" stroke-width="2" width="656" x="1770" y="1455" /><g class="poster-text" id="det-label"><text fill="#17374A" font-family="Open Sans" font-size="27" font-weight="bold" text-anchor="middle" x="2098.0" y="1511.3832">DETERMINISTIC CORE</text></g><g class="poster-text" id="det-detail"><text fill="#243846" font-family="Open Sans" font-size="20" font-weight="normal" text-anchor="middle" x="2098.0" y="1553.0320000000002">Validation • constrained transformations</text><text fill="#243846" font-family="Open Sans" font-size="20" font-weight="normal" text-anchor="middle" x="2098.0" y="1577.832">Structured outputs</text></g><g class="arrow-connector" id="arrow-acp-mcp"><line stroke="#16796F" stroke-linecap="round" stroke-width="4" x1="1375" x2="1342.6054175545335" y1="1338" y2="1413.5873590394222" /><polygon fill="#16796F" points="1334.72703158295,1431.9702596397833 1335.252257314389,1410.4360046507888 1349.958577794678,1416.7387134280555" /></g><g class="arrow-connector" id="arrow-acp-det"><line stroke="#16796F" stroke-linecap="round" stroke-width="4" x1="2050" x2="2086.242125427445" y1="1338" y2="1414.108463397634" /><polygon fill="#16796F" points="2094.840797035292,1432.1656737741127 2079.0192412768533,1417.5479320407728 2093.4650095780366,1410.6689947544953" /></g><g class="poster-text" id="architecture-note"><text fill="#55727B" font-family="Open Sans" font-size="18" font-weight="normal" text-anchor="start" x="958" y="1663.9288000000001">Source status: R/Strategus demonstrated; Atlas3/WebAPI early-stage. Coding-agent support and exact</text><text fill="#55727B" font-family="Open Sans" font-size="18" font-weight="normal" text-anchor="start" x="958" y="1686.2488">OHDSI deterministic package bindings are intentionally not represented as verified implementation.</text></g><rect fill="#FBFCFB" height="760" rx="16" stroke="#B9D1CF" stroke-width="2" width="840" x="2544" y="718" /><g class="poster-text" id="flows-heading"><text fill="#17374A" font-family="Open Sans" font-size="29" font-weight="bold" text-anchor="start" x="2584" y="786.2264">2  NAMED GOVERNED FLOWS</text></g><g class="poster-text" id="flows-intro"><text fill="#55727B" font-family="Open Sans" font-size="20" font-weight="normal" text-anchor="start" x="2584" y="844.032">Excerpt of Table 1 — stable endpoints</text><text fill="#55727B" font-family="Open Sans" font-size="20" font-weight="normal" text-anchor="start" x="2584" y="868.832">with defined inputs, outputs and validation.</text></g><g class="poster-text" id="flow-list"><text fill="#17374A" font-family="Open Sans" font-size="23" font-weight="bold" text-anchor="start" x="2584" y="995.5752">phenotype_recommendation</text><text fill="#17374A" font-family="Open Sans" font-size="23" font-weight="bold" text-anchor="start" x="2584" y="1026.8552">phenotype_make_computable</text><text fill="#17374A" font-family="Open Sans" font-size="23" font-weight="bold" text-anchor="start" x="2584" y="1058.1352">concept_sets_review</text><text fill="#17374A" font-family="Open Sans" font-size="23" font-weight="bold" text-anchor="start" x="2584" y="1089.4152">cohort_critique_general_design</text><text fill="#17374A" font-family="Open Sans" font-size="23" font-weight="bold" text-anchor="start" x="2584" y="1120.6951999999999">workflow_context_dialogue</text></g><g class="poster-text" id="flows-foot"><text fill="#243846" font-family="Open Sans" font-size="21" font-weight="normal" text-anchor="start" x="2584" y="1277.8136">Flows apply deterministic checks at each stage;</text><text fill="#243846" font-family="Open Sans" font-size="21" font-weight="normal" text-anchor="start" x="2584" y="1303.8536000000001">restricted outputs identify user-confirmable steps</text><text fill="#243846" font-family="Open Sans" font-size="21" font-weight="normal" text-anchor="start" x="2584" y="1329.8936">before consequential writes.</text></g><rect fill="#F4F1E9" height="705" rx="16" stroke="#B9D1CF" stroke-width="2" width="840" x="2544" y="1513" /><g class="poster-text" id="placeholder-heading"><text fill="#17374A" font-family="Open Sans" font-size="28" font-weight="bold" text-anchor="start" x="2584" y="1578.8048000000001">APPLICATION EVIDENCE</text></g><g class="poster-text" id="placeholder-icon"><text fill="#16796F" font-family="Open Sans" font-size="108" font-weight="normal" text-anchor="middle" x="2964.0" y="1733.5328">□</text></g><g class="poster-text" id="placeholder-copy"><text fill="#8A5A22" font-family="Open Sans" font-size="22" font-weight="bold" text-anchor="middle" x="2964.0" y="1818.1352">NO APPROVED AUTHENTIC SCREENSHOT</text><text fill="#8A5A22" font-family="Open Sans" font-size="22" font-weight="bold" text-anchor="middle" x="2964.0" y="1845.4152">AVAILABLE FOR THIS PUBLIC POSTER BUILD</text></g><g class="poster-text" id="placeholder-detail"><text fill="#55727B" font-family="Open Sans" font-size="20" font-weight="normal" text-anchor="middle" x="2964.0" y="1923.132">Placeholder only — not a system interface or</text><text fill="#55727B" font-family="Open Sans" font-size="20" font-weight="normal" text-anchor="middle" x="2964.0" y="1947.932">scientific evidence. Replace only with an approved</text><text fill="#55727B" font-family="Open Sans" font-size="20" font-weight="normal" text-anchor="middle" x="2964.0" y="1972.732">demo/repository artifact after source review.</text></g><rect fill="#FBFCFB" height="455" rx="16" stroke="#B9D1CF" stroke-width="2" width="1590" x="918" y="1763" /><g class="poster-text" id="workflow-heading"><text fill="#17374A" font-family="Open Sans" font-size="29" font-weight="bold" text-anchor="start" x="958" y="1830.2264">3  WORKFLOW-CONTEXTUAL GUIDANCE VIA /ohdsi</text></g><g class="poster-text" id="workflow-question-label"><text fill="#16796F" font-family="Open Sans" font-size="20" font-weight="bold" text-anchor="start" x="958" y="1887.432">EXAMPLE QUESTION</text></g><g class="poster-text" id="workflow-question"><text fill="#17374A" font-family="Open Sans" font-size="25" font-weight="bold" text-anchor="start" x="958" y="1937.54">“How should I think about time at risk</text><text fill="#17374A" font-family="Open Sans" font-size="25" font-weight="bold" text-anchor="start" x="958" y="1968.54">in this incidence design?”</text></g><g class="poster-text" id="workflow-answer-label"><text fill="#16796F" font-family="Open Sans" font-size="20" font-weight="bold" text-anchor="start" x="1710" y="1887.432">WHAT /ohdsi ADDS</text></g><g class="poster-text" id="workflow-answer"><text fill="#243846" font-family="Open Sans" font-size="21" font-weight="normal" text-anchor="start" x="1710" y="1943.8136">The shell supplies workflow type, current step, active role,</text><text fill="#243846" font-family="Open Sans" font-size="21" font-weight="normal" text-anchor="start" x="1710" y="1969.8536000000001">selected cohorts/artifacts and constraints. ACP returns a normalized</text><text fill="#243846" font-family="Open Sans" font-size="21" font-weight="normal" text-anchor="start" x="1710" y="1995.8936">response with step-specific guidance, cautions and next actions.</text></g><g class="poster-text" id="workflow-caution"><text fill="#55727B" font-family="Open Sans" font-size="19" font-weight="normal" text-anchor="start" x="958" y="2093.0103999999997">The poster shows the contextual mechanism, not a fabricated literal LLM reply.</text></g><rect fill="#17374A" height="330" rx="0" stroke="none" stroke-width="0" width="3456" x="0" y="2262" /><g class="poster-text" id="footer-head"><text fill="#A9DCD2" font-family="Open Sans" font-size="23" font-weight="bold" text-anchor="start" x="72" y="2322.1967999999997">INTERPRETATION, LIMITS &amp; PROVENANCE</text></g><g class="poster-text" id="footer-copy"><text fill="#FFFFFF" font-family="Open Sans" font-size="20" font-weight="normal" text-anchor="start" x="72" y="2376.5319999999997">Architecture and functional-prototype report; not evidence of improved efficiency, decision accuracy, clinical safety or study outcomes.</text><text fill="#FFFFFF" font-family="Open Sans" font-size="20" font-weight="normal" text-anchor="start" x="72" y="2401.332">Scientific source: supplied private manuscript. Design decisions: DESIGN_BRIEF.md. No patient-level data, credentials or authentic screenshot assets are included.</text></g><g class="poster-text" id="footer-refs"><text fill="#DCE9ED" font-family="Open Sans" font-size="18" font-weight="normal" text-anchor="start" x="72" y="2467.9287999999997">Selected sources in supplied manuscript: Study Agent repository; SlashOhdsiStrategusAssistant; SlashOhdsiAcpClient;</text><text fill="#DCE9ED" font-family="Open Sans" font-size="18" font-weight="normal" text-anchor="start" x="72" y="2490.2488">Study Agent / Atlas3-WebAPI demonstrations. Verify URLs, branding and submission metadata before any public release.</text></g><g class="poster-text" id="footer-build"><text fill="#FFFFFF" font-family="Open Sans" font-size="19" font-weight="bold" text-anchor="end" x="3312" y="2391.2304">EDITABLE SVG • 48 × 36 in • build.py + poster.toml</text><text fill="#FFFFFF" font-family="Open Sans" font-size="19" font-weight="bold" text-anchor="end" x="3312" y="2414.7904">No QR destination supplied; none generated.</text></g></svg>