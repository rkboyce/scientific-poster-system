<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="36in" version="1.1" viewBox="0 0 1440 1080" width="48in" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="1080" width="1440" x="0" y="0" /><rect fill="#17374A" height="145" rx="0" stroke="none" stroke-width="1.4" width="1440" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="32" font-weight="bold" text-anchor="middle" x="720" y="50">OHDSI Study Agent for Human–AI Team-Based</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="32" font-weight="bold" text-anchor="middle" x="720" y="94">Real-World Evidence Generation in the VHA</text><text fill="#DCE9ED" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="720" y="125">Richard D. Boyce, PhD   |   University of Pittsburgh   •   VA VINCI</text><rect fill="#E4F3EF" height="118" rx="8" stroke="#C8D7D5" stroke-width="1.4" width="1406" x="17" y="164" /><text fill="#17374A" font-family="DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" x="45" y="203">Study Agent offers reusable, governed AI support for OHDSI research workflows</text><text fill="#55727B" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" x="46" y="239">Service-based ACP/MCP coordination + deterministic validation; researcher confirmation remains central.</text><rect fill="#FBFCFB" height="636" rx="9" stroke="#C8D7D5" stroke-width="1.4" width="322" x="17" y="304" /><text fill="#17374A" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="start" x="34" y="338">WHY / GOVERNANCE</text><rect fill="#5ABE9A" height="2" rx="0" stroke="none" stroke-width="1.4" width="288" x="34" y="349" /><text fill="#243846" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start" x="36" y="384">RWE study design involves linked</text><text fill="#243846" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start" x="36" y="412">judgments about phenotypes,</text><text fill="#243846" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start" x="36" y="440">causal assumptions, cohorts,</text><text fill="#243846" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start" x="36" y="468">and interpretation.</text><rect fill="#5ABE9A" height="3" rx="0" stroke="none" stroke-width="1.4" width="285" x="35" y="505" /><text fill="#16796F" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" x="36" y="547">RESEARCHER CONTROL</text><text fill="#243846" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" x="36" y="584">Confirmations and stage gates</text><text fill="#243846" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" x="36" y="612">constrain consequential steps.</text><text fill="#243846" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" x="36" y="640">Model inputs use sanitized</text><text fill="#243846" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" x="36" y="668">summaries and metadata,</text><text fill="#243846" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" x="36" y="696">not row-level clinical data.</text><text fill="#16796F" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" x="36" y="770">PROTOTYPE MATURITY</text><text fill="#243846" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" x="36" y="805">~TRL 4–5 (report estimate)</text><text fill="#243846" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" x="36" y="831">Scripted demonstration workflows</text><text fill="#243846" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" x="36" y="857">No comparative effectiveness</text><text fill="#243846" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" x="36" y="883">or decision-accuracy results</text><rect fill="#FBFCFB" height="445" rx="9" stroke="#C8D7D5" stroke-width="1.4" width="714" x="357" y="304" /><text fill="#17374A" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="start" x="374" y="338">1  SERVICE-BASED ARCHITECTURE</text><rect fill="#5ABE9A" height="2" rx="0" stroke="none" stroke-width="1.4" width="680" x="374" y="349" /><text fill="#55727B" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" x="375" y="369">Multiple clients access shared services</text><rect fill="#F4F1E9" height="74" rx="7" stroke="#C8D7D5" stroke-width="1.4" width="206" x="377" y="390" /><text fill="#17374A" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" x="387" y="421">R / Strategus</text><text fill="#55727B" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start" x="387" y="447">Client shells</text><rect fill="#F4F1E9" height="74" rx="7" stroke="#C8D7D5" stroke-width="1.4" width="207" x="601" y="390" /><text fill="#17374A" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" x="611" y="421">Atlas3 / WebAPI</text><text fill="#55727B" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start" x="611" y="447">Early-stage integration</text><rect fill="#F4F1E9" height="74" rx="7" stroke="#C8D7D5" stroke-width="1.4" width="222" x="827" y="390" /><text fill="#17374A" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" x="837" y="421">Coding agents</text><text fill="#55727B" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start" x="837" y="447">Skills.md interface*</text><rect fill="#D9F0E8" height="84" rx="8" stroke="#16796F" stroke-width="1.4" width="440" x="485" y="511" /><text fill="#17374A" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="start" x="503" y="543">ACP server: orchestration + governance</text><text fill="#243846" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" x="503" y="567">Named flows • state • routing • confirmations</text><g class="arrow-connector"><line stroke="#16796F" stroke-linecap="round" stroke-width="3.7" x1="475" x2="689.2616055411304" y1="468" y2="506.02911613500584" /><polygon fill="#16796F" points="701.0769428062148,508.1262106279429 688.3878161690733,510.952173328791 690.1353949131875,501.1060589412207" /></g><g class="arrow-connector"><line stroke="#16796F" stroke-linecap="round" stroke-width="3.7" x1="706" x2="706.0" y1="468" y2="492.0" /><polygon fill="#16796F" points="706.0,504.0 701.0,492.0 711.0,492.0" /></g><g class="arrow-connector"><line stroke="#16796F" stroke-linecap="round" stroke-width="3.7" x1="930" x2="722.7221935331856" y1="468" y2="505.93924136222944" /><polygon fill="#16796F" points="710.9182922156429,508.09977687124393 721.8219704044296,501.02094914658664 723.6224166619417,510.85753357787223" /></g><rect fill="#EEF2FA" height="79" rx="7" stroke="#C8D7D5" stroke-width="1.4" width="311" x="388" y="641" /><text fill="#17374A" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="start" x="407" y="672">MCP servers</text><text fill="#243846" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" x="407" y="697">Tool contracts • prompt bundles</text><rect fill="#EEF2FA" height="79" rx="7" stroke="#C8D7D5" stroke-width="1.4" width="337" x="714" y="641" /><text fill="#17374A" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="start" x="732" y="672">Deterministic core</text><text fill="#243846" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" x="732" y="697">Validation • constrained transforms</text><g class="arrow-connector"><line stroke="#16796F" stroke-linecap="round" stroke-width="3.7" x1="659" x2="560.0993983728246" y1="598" y2="631.5402040300855" /><polygon fill="#16796F" points="548.7351171684778,635.3941776559075 558.493576028732,626.8050868616077 561.7052207169171,636.2753211985633" /></g><g class="arrow-connector"><line stroke="#16796F" stroke-linecap="round" stroke-width="3.7" x1="785" x2="858.4293432841989" y1="598" y2="630.1769032368961" /><polygon fill="#16796F" points="869.4203950835879,634.9932068343812 856.4225501185801,634.7565081533082 860.4361364498177,625.597298320484" /></g><text fill="#55727B" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" x="380" y="741">* Coding-agent integration: additional design context; verify before publication.</text><rect fill="#FBFCFB" height="445" rx="9" stroke="#C8D7D5" stroke-width="1.4" width="334" x="1089" y="304" /><text fill="#17374A" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="start" x="1106" y="338">2  SUPPORTED FLOWS</text><rect fill="#5ABE9A" height="2" rx="0" stroke="none" stroke-width="1.4" width="300" x="1106" y="349" /><text fill="#243846" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" x="1107" y="381">phenotype_recommendation</text><text fill="#243846" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" x="1107" y="424">phenotype_make_computable</text><text fill="#243846" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" x="1107" y="467">concept_sets_review</text><text fill="#243846" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" x="1107" y="510">cohort_critique_general_design</text><text fill="#243846" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" x="1107" y="553">workflow_context_dialogue</text><rect fill="#E4F3EF" height="108" rx="7" stroke="#C8D7D5" stroke-width="1.4" width="299" x="1106" y="611" /><text fill="#243846" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" x="1122" y="646">OHDSI deterministic code can be</text><text fill="#243846" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" x="1122" y="673">reused through bounded flows;</text><text fill="#243846" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" x="1122" y="700">specific integrations to verify.</text><rect fill="#FBFCFB" height="171" rx="9" stroke="#C8D7D5" stroke-width="1.4" width="514" x="357" y="769" /><text fill="#17374A" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="start" x="374" y="803">3  WORKFLOW CONTEXT + EXAMPLE</text><rect fill="#5ABE9A" height="2" rx="0" stroke="none" stroke-width="1.4" width="480" x="374" y="814" /><text fill="#243846" font-family="DejaVu Sans" font-size="15.5" font-weight="normal" text-anchor="start" x="377" y="834">“How should I think about time at risk?”</text><text fill="#243846" font-family="DejaVu Sans" font-size="15.5" font-weight="normal" text-anchor="start" x="377" y="860">/ohdsi uses incidence-study stage, role, and</text><text fill="#243846" font-family="DejaVu Sans" font-size="15.5" font-weight="normal" text-anchor="start" x="377" y="886">selected artifacts to return contextual guidance.</text><rect fill="#FBFCFB" height="171" rx="9" stroke="#C8D7D5" stroke-width="1.4" width="533" x="890" y="769" /><text fill="#17374A" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="start" x="907" y="803">4  DEMONSTRATIONS + EVALUATION</text><rect fill="#5ABE9A" height="2" rx="0" stroke="none" stroke-width="1.4" width="499" x="907" y="814" /><text fill="#243846" font-family="DejaVu Sans" font-size="15.5" font-weight="normal" text-anchor="start" x="908" y="834">R Strategus prototype; early Atlas3/WebAPI support.</text><text fill="#243846" font-family="DejaVu Sans" font-size="15.5" font-weight="normal" text-anchor="start" x="908" y="860">Screenshot slot: authentic demo asset required.</text><text fill="#243846" font-family="DejaVu Sans" font-size="15.5" font-weight="normal" text-anchor="start" x="908" y="886">Needs larger validation of accuracy, utility and reliance.</text><rect fill="#F4F1E9" height="122" rx="0" stroke="none" stroke-width="1.4" width="1440" x="0" y="958" /><text fill="#16796F" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" x="27" y="994">EXHIBITS / HANDOFF</text><text fill="#243846" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" x="27" y="1024">Next: verified architecture diagram; compact named-flow table; authentic application screenshot.</text><text fill="#243846" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" x="27" y="1047">Unverified: coding-agent support and precise OHDSI code reuse. No outcome claims.</text><text fill="#55727B" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="end" x="1406" y="1058">DESIGN WIREFRAME v0.3 • NOT FINAL POSTER</text></svg>